name: Zuständigkeit falsch
description: Die Karte nennt eine falsche oder ungenaue Stelle – oder du kennst die Regel deines Landes genauer.
title: "Zuständigkeit: "
labels: ["zuständigkeit"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Am meisten hilft eine **Fundstelle**: Gesetz, Verordnung oder amtliche
        Seite, am besten mit Paragraf und Fassung. Eine schriftliche Antwort der Behörde hilft auch.
        Bitte keine persönlichen Daten eintragen – das Issue ist öffentlich.

  - type: input
    id: link
    attributes:
      label: Link zur Karte
      description: Den Link aus der Adresszeile kopieren, nachdem du die Straße angeklickt hast. Der Punkt steht darin (`&p=…`).
      placeholder: "https://vizsim.github.io/wer-ist-zustaendig/#karte=15/48.4005/11.7448&p=48.4005,11.7448"
    validations:
      required: true

  - type: input
    id: gemeinde
    attributes:
      label: Gemeinde
      description: Name, gern mit Regionalschlüssel (ARS) aus der Auskunft.
      placeholder: "Freising, 091780124124"

  - type: dropdown
    id: strasse
    attributes:
      label: Welche Straße ist betroffen?
      options:
        - Gemeindestraße
        - Kreisstraße
        - Landes- bzw. Staatsstraße
        - Bundesstraße
        - Autobahn
        - weiß nicht
    validations:
      required: true

  - type: textarea
    id: karte
    attributes:
      label: Was die Karte sagt
      description: Zuständige Stelle und Sicherheit aus der Auskunft.

  - type: textarea
    id: richtig
    attributes:
      label: Was richtig ist
      description: Welche Stelle ist zuständig, und gilt das für alle Straßen oder nur für bestimmte?
    validations:
      required: true

  - type: textarea
    id: fundstelle
    attributes:
      label: Fundstelle
      description: Link und genaue Angabe (z. B. „§ 2 SächsStrVRG in der Fassung vom …"). Ohne Fundstelle können wir die Regel nur als „vermutlich" führen.
    validations:
      required: true

  - type: checkboxes
    id: datenschutz
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine persönlichen Daten (Namen, Anschriften, Telefonnummern) eingetragen.
          required: true
