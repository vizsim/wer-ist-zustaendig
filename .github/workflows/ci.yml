name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: JS-Module und Werkzeuge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Karte parst
        run: node --check main.js

  pipeline:
    name: Pipeline (inkl. Ende-zu-Ende mit Testdaten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tippecanoe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tippecanoe
      - uses: astral-sh/setup-uv@v6
      - name: uv sync
        working-directory: pipeline
        run: uv sync --locked
      - name: ruff
        working-directory: pipeline
        run: uv run ruff check && uv run ruff format --check
      - name: pytest
        working-directory: pipeline
        run: uv run pytest

  pages:
    name: Karte auf GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [js, pipeline]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die Karte (Daten kommen aus dem Bucket)
        run: mkdir _site && cp -r index.html main.js style.css js assets _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
