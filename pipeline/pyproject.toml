[project]
name = "zustkarte"
version = "0.1.0"
description = "Pipeline für „Wer ist zuständig?“: Gemeindegrenzen (BKG VG25) und Gemeindeverzeichnis (Destatis GV-ISys) → Gemeindetabelle und PMTiles"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.8",   # GeoPackage/FlatGeobuf lesen und schreiben (bringt GDAL mit)
    "pandas>=2.2",
    "requests>=2.32",
    "typer>=0.12",    # CLI
    "pyyaml>=6.0",
]

[project.scripts]
zust = "zustkarte.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zustkarte"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# System-Binaries (NICHT via pip): tippecanoe + tile-join (Grenzschicht), node >= 20
# (Landesdateien und Prüfwerkzeuge im Repo-Root). Ohne tippecanoe gibt `zust grenzen` die
# Kommandos nur aus.
