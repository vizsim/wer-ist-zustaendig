# Quellen (von Hand gepflegt). `zust fetch <id>` lädt `url` nach data/raw/<id>/ und schreibt
# daneben <datei>.meta.json (URL, Größe, SHA-256, Abrufdatum). `stand` ist der Datenstand, den
# die Pipeline in alle Ausgaben schreibt und – wo möglich – gegen die Daten prüft.
#
# Die URLs mit `?__blob=publicationFile&v=N` (Destatis) ändern sich bei jeder neuen Ausgabe:
# dann die Seite (`seite`) öffnen und den Link übernehmen. Lizenz und Quellenvermerk stehen
# je Quelle hier; README und Viewer übernehmen sie von hier bzw. aus den Landesdateien.

quellen:
  vg25:
    label: "Verwaltungsgebiete 1:25 000 (VG25), Stand 31.12."
    url: "https://daten.gdz.bkg.bund.de/produkte/vg/vg25_ebenen/aktuell/vg25.utm32s.gpkg.zip"
    seite: "https://gdz.bkg.bund.de/index.php/default/verwaltungsgebiete-1-25-000-stand-31-12-vg25.html"
    doku: "https://sgx.geodatenzentrum.de/web_public/gdz/dokumentation/deu/vg25.pdf"
    stand: "2025-12-31"
    lizenz: "CC BY 4.0"
    vermerk: "© BKG (2026) CC BY 4.0, Datenquellen: https://sgx.geodatenzentrum.de/web_public/gdz/datenquellen/datenquellen_vg25.pdf"

  gv100ad:
    label: "Gemeindeverzeichnis GV-ISys, Jahresausgabe 31.12. (GV100AD, feste Satzlänge)"
    url: "https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/Archiv/GV100ADJ/GV100AD_31122025.zip?__blob=publicationFile&v=2"
    seite: "https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/Archiv/GV100ADJ/GV100AD_31122025.html"
    stand: "2025-12-31"
    lizenz: "© Statistisches Bundesamt (Destatis); Vervielfältigung und Verbreitung mit Quellenangabe gestattet"
    vermerk: "Statistisches Bundesamt (Destatis), Gemeindeverzeichnis GV-ISys, Stand 31.12.2025"

  # Optional: neuere Monatsausgabe. Nur zum Markieren von Gemeinden, die seit dem Datenstand
  # aufgelöst, umgeschlüsselt oder umbenannt wurden (`gebietsaenderung`), nicht zum Umrechnen.
  gv100ad_aktuell:
    label: "Gemeindeverzeichnis GV-ISys, Monatsausgabe (GV100AD) – Gebietsänderungen seit dem Datenstand"
    url: "https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/Archiv/GV100ADQ/GV100AD3110.zip?__blob=publicationFile&v=13"
    seite: "https://www.destatis.de/DE/Themen/Laender-Regionen/Regionales/Gemeindeverzeichnis/Administrativ/Archiv/GV100ADQ/GV100AD3110.html"
    stand: "2026-10-31"
    optional: true
    lizenz: "© Statistisches Bundesamt (Destatis); Vervielfältigung und Verbreitung mit Quellenangabe gestattet"
    vermerk: "Statistisches Bundesamt (Destatis), Gemeindeverzeichnis GV-ISys, Stand 31.10.2026"

  # Optional, für die Kontakte in Sachsen (kein Bundesportal-Eintrag): Anschrift, Telefon, E-Mail
  # und Webseite jeder Gemeinde- und Kreisverwaltung – das Rathaus bzw. Landratsamt, nicht die
  # Straßenverkehrsbehörde. Ohne Download-Link: auf der Seite „Download csv-File" wählen, dann
  # `zust fetch lds_sachsen --datei <pfad>`. `zust kontakte` liest die Datei mit (anschriften.py).
  lds_sachsen:
    label: "Gemeindeverzeichnis der Landesdirektion Sachsen: Anschriften der Gemeinde- und Kreisverwaltungen"
    seite: "https://www.lds.sachsen.de/?ID=2392&art_param=155"
    datei: "LDS_Gemeindeverzeichnis_Sachsen.csv"
    kurz: "Landesdirektion Sachsen"
    optional: true
    lizenz: "Datenlizenz Deutschland – Namensnennung – Version 2.0"
    vermerk: "Landesdirektion Sachsen, Gemeindeverzeichnis (https://www.lds.sachsen.de/?ID=2392&art_param=155), Datenlizenz Deutschland – Namensnennung – Version 2.0 (https://www.govdata.de/dl-de/by-2-0); Auszug, Daten geändert"

# Dienste, die je Gemeinde abgefragt werden – nicht per `zust fetch`, sondern mit eigenem Schritt.
# Bundesportal: Die Länder pflegen dort je Leistung und Gemeinde die zuständigen Stellen mit
# Anschrift, Telefon und E-Mail. Die API ist nicht dokumentiert (abgelesen am Frontend des
# Portals, 10/2026); `{…}` werden beim Abruf ersetzt.
dienste:
  bundesportal:
    label: "Bundesportal (verwaltung.bund.de): zuständige Stellen für „Aufstellung von Verkehrszeichen anregen“"
    leistung: "99108014042000"
    laender_url: "https://verwaltung.bund.de/leistungsverzeichnis/DE/api/zustaendigkeiten/STAMM/{leistung}"
    kontakt_url: "https://verwaltung.bund.de/leistungsverzeichnis/de/api/kontakt/{land}/{id}/{ars}?name=zustaendigestellen"
    seite: "https://verwaltung.bund.de/leistungsverzeichnis/de/leistung/99108014042000"
    pause: 1.0  # Sekunden zwischen zwei Anfragen
    # Länder, deren Kontakte in die Landesdateien gehen – nach Durchsicht der Review-CSV
    # freigegeben. Weitere Länder dürfen schon im Cache liegen.
    freigegeben: [TH, BY, SH, NI, MV, ST]
    lizenz: "Amtliche Kontaktangaben; Nutzungsbedingungen des Portals nicht gesondert geprüft"
    vermerk: "Kontakt laut Bundesportal (verwaltung.bund.de)"

# Ausgaben (Vertrag mit Konsumenten, docs/VERTRAG.md). `file` relativ zu data/.
datasets:
  zust_gemeinden:
    file: "zustaendigkeit/gemeinden.pmtiles"
    label: "Gemeinden und Kreise (Grenzen, ARS, Ebene der Stelle für Gemeindestraßen)"
    attribution: "© BKG (2026) CC BY 4.0, Datenquellen: https://sgx.geodatenzentrum.de/web_public/gdz/datenquellen/datenquellen_vg25.pdf"
  zust_index:
    file: "zustaendigkeit/index.json"
    label: "Zuständige Straßenverkehrsbehörden: Übersicht und Landesdateien"
    attribution: "© BKG (2026) CC BY 4.0; Statistisches Bundesamt (Destatis), Gemeindeverzeichnis GV-ISys"
