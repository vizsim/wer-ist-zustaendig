# Kontakte von Hand – nur wo das Bundesportal für die Gemeinden keine passende Stelle nennt
# (Portalfehler, siehe docs/TODO.md). Jeder Eintrag ist von der Webseite der Behörde selbst
# abgeschrieben, mit Datum. Beim jährlichen Durchgang prüfen, ob das Portal inzwischen eine
# passende Stelle nennt – dann den Eintrag löschen.
#
# Schlüssel: Kreis-ARS (5 Stellen) – Kontakt der Kreisebene für alle Gemeinden des Kreises, für
# die das Portal keinen nennt. Oder ARS einer Gemeinde (12 Stellen) mit `rolle` (`kreis` oder
# `gemeinde`) – ersetzt den Portalwert dieser Rolle; `gemeinde` gilt auch, wo ihr Verband zuständig
# ist. `rolle: verband` nur für den Verband (Stelle `v…`), wenn die Gemeinde selbst einen anderen
# Kontakt hat. Nur Funktionspostfächer, keine Personen.

# `allgemein: true`, wenn der Eintrag nur die allgemeine Anschrift der Verwaltung ist (Zentrale
# statt Verkehrsstelle) – die Karte sagt dann dazu, dass man nach der Straßenverkehrsbehörde fragt.
#
# Länder, die die Leistung nicht im Bundesportal führen und keine eigene Quelle haben: Ihre
# Kontakte kommen nur aus dieser Datei (`zust kontakte`, auch mit --nur-cache). In Berlin hat der
# Senat die Rolle `kreis` (Schlüssel 11000), jeder Bezirk die Rolle `gemeinde` (Schlüssel
# 1100000000 + Bezirksnummer). In Bremen haben das Amt für Straßen und Verkehr (04011) und der
# Magistrat Bremerhaven (04012) die Rolle `kreis` – `kontaktRolle` in js/resolve.js; die Polizei
# Bremen (Alternative in der Stadt Bremen) hat keine. Hamburg fehlt noch: Welches
# Polizeikommissariat zuständig ist, wissen wir nicht; die Verkehrsdirektion (Alternative) hätte die
# Rolle `kreis` (Schlüssel 02000, dann HH hier ergänzen).
#
# `quelle` (optional) ersetzt die Herkunft „Webseite der Behörde, Stand …", wenn ein Eintrag von
# woanders stammt.
nur_von_hand: [BE, HB]

