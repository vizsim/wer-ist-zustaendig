# Kontakte von Hand – nur wo das Bundesportal für die Gemeinden keine passende Stelle nennt
# (Portalfehler, siehe docs/TODO.md). Jeder Eintrag ist von der Webseite der Behörde selbst
# abgeschrieben, mit Datum. Beim jährlichen Durchgang prüfen, ob das Portal inzwischen eine
# passende Stelle nennt – dann den Eintrag löschen.
#
# Schlüssel: Kreis-ARS (5 Stellen) – Kontakt der Kreisebene für alle Gemeinden des Kreises, für
# die das Portal keinen nennt. Oder ARS einer Gemeinde (12 Stellen) mit `rolle` (`kreis` oder
# `gemeinde`) – ersetzt den Portalwert dieser Rolle. Nur Funktionspostfächer, keine Personen.

